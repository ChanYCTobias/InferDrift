name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package (CPU only, no extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: Run the tests
        run: python -m pytest -q
      - name: Run the installed package and the README quickstart outside the checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python - <<'EOF'
          import os
          import inferdrift
          path = os.path.realpath(inferdrift.__file__)
          checkout = os.path.realpath(os.environ["GITHUB_WORKSPACE"])
          print("inferdrift imported from", path)
          assert not path.startswith(checkout + os.sep), "imported from the checkout, not the installed package"
          EOF
          inferdrift --help
          # the offline quickstart from README.md
          inferdrift standin --port 8099 &
          REF_PID=$!
          inferdrift standin --port 8100 &
          CAND_PID=$!
          sleep 1
          inferdrift compare --ref http://127.0.0.1:8099/v1 --cand http://127.0.0.1:8100/v1 --out demo
          cat demo/summary.md
          inferdrift compare --ref http://127.0.0.1:8099/v1 --cand http://127.0.0.1:8100/v1 \
            --bank math_short --tau 0.05 --out demo_math
          inferdrift compare --ref http://127.0.0.1:8099/v1 --cand http://127.0.0.1:8100/v1 \
            --criterion harmful_abs --out demo_abs
          kill $REF_PID $CAND_PID
          inferdrift power --tau 0.05
          python - <<'EOF'
          import json
          v = json.load(open("demo/report.json"))["verdict"]
          assert v["verdict"] == "INCONCLUSIVE_UNDERPOWERED", v["verdict"]
          assert isinstance(v["items_needed"], int) and v["items_needed"] > v["n"], v["items_needed"]
          for d in ("demo_math", "demo_abs"):
              got = json.load(open(f"{d}/report.json"))["verdict"]["verdict"]
              assert got == "EQUIVALENT_WITHIN_TAU", (d, got)
          EOF
